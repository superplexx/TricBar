name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  win11:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (DLL + exes)
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TricBar-Win11
          path: TricBar-Win11-v*.zip
          
